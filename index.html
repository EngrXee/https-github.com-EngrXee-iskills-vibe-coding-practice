<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>AI Project Tracker</h1>
      <p class="subtitle">Keep track of your AI project tasks</p>
    </header>

    <!-- Task counters -->
    <section class="stats">
      <div class="stat stat-total">
        <span id="total-count" class="stat-number">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat stat-completed">
        <span id="completed-count" class="stat-number">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat stat-pending">
        <span id="pending-count" class="stat-number">0</span>
        <span class="stat-label">Pending</span>
      </div>
    </section>

    <!-- Form to add a new task -->
    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Enter a task title..."
        maxlength="100"
        autocomplete="off"
      >
      <button type="submit" class="btn btn-add">Add Task</button>
    </form>

    <!-- List where tasks are shown -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Message shown when there are no tasks -->
    <p id="empty-message" class="empty-message">
      No tasks yet. Add your first task above to get started!
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
